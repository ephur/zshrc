# Change keybind to shift-space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal capabilities: true color (RGB) + kitty keyboard protocol passthrough
# so Dracula renders exact hex colors instead of 256-palette approximations
set -g default-terminal "tmux-256color"
set -as terminal-features ',alacritty*:RGB'
set -as terminal-features ',alacritty*:extkeys'
set -s extended-keys on

# Let programs inside tmux set the system clipboard via OSC 52 (works over ssh)
set -g set-clipboard on

# turn off visual bell
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# extend history
set -g history-limit 50000

# don't use ordinal value for base panes
set -g base-index 1
setw -g pane-base-index 1

# set colors for copy selection
setw -g mode-style 'fg=color2,bg=color8 bold'

# set pane borders
# set -g pane-border-style 'fg=color103'
# set -g pane-active-border-style 'fg=color229'

# Window/Pane management
# split panes using d/D
bind d split-window -h -c "#{pane_current_path}"
bind D split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# switch panes using alt+arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# resize using the same keys with prefix
bind -r M-Left resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r M-Up resize-pane -U 5
bind -r M-Down resize-pane -D 5
# bind -r h resize-pane -L 5
# bind -r l resize-pane -R 5
# create new window
bind n new-window
bind j previous-window
bind k next-window
# don't auto rename windows
set -g allow-rename off

# Mouse/Copy Mode
# yup, that's right, use the mouse.
set -g mouse on
# but still use vi keys for copy mode
setw -g mode-keys vi
bind c copy-mode
# reload config
bind r source-file "${XDG_CONFIG_HOME}/tmux/tmux.conf" \; display-message "Config reloaded..."

# Load the tmux plugin manager and plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# use FZF to find/extract URLs from the terminal and open them
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-history-limit '2000'

# use FZF to manage/create tmux sessions
set -g @plugin 'sainnhe/tmux-fzf'

# controls styles / visual looks / status bar
set -g @plugin 'dracula/tmux'

# persist/restore sessions across tmux server & machine restarts
# (install with prefix + I after first load)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# dracula options
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-plugins "synchronize-panes time"
set -g @dracula-show-timezone false
set -g @dracula-show-left-icon session
set -g @dracula-left-icon-padding 0
set -g @dracula-border-contrast true

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
